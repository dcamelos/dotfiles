; ~/.config/polybar/bars/material/config.ini
include-file = ~/.config/polybar/config-i3.ini

[bar/mybar]
inherit = bar/parent
width = 98%
offset-x = 1.2%
offset-y = 1%
height = 26pt
border-size = 2.5pt
radius = 0
line-size = 2pt
border-color = ${colors.window-background}
background = ${colors.window-background}
foreground = ${colors.foreground}
modules-left =  mymenu bd2 bi bi ewmh bd bi xwindow bd   bi network-menu bd tray 
modules-center = bi date bd bi pacupdate bd now-playing
modules-right = bi battery bd bi pulseaudio bd bi memory bd bi cpu bd bi cpu-temp bd bi filesystem bd bi magic-click bd bi2 sessionLogout

; Si quieres cambiar los separadores a circulares solo para esta barra:

[module/bi]
type = custom/text
label = " "
label-background = ${colors.window-background}

[module/bd]
type = custom/text
label = " "
label-background = ${colors.window-background}

[module/bi2]
type = custom/text
label = "  "
label-background = ${colors.aurora-blue}


[module/bd2]
type = custom/text
label = "  "
label-background = ${colors.aurora-blue}
