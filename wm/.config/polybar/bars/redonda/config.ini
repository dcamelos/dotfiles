; ~/.config/polybar/bars/redonda/config.ini
include-file = ~/.config/polybar/config-i3.ini

[bar/mybar]
inherit = bar/parent
width = 98%
offset-x = 1.5%
offset-y = 1%
height = 22pt
border-size = 2.5pt
radius = 15
border-color = ${colors.background}
line-size = 2pt

; Si quieres cambiar los separadores a circulares solo para esta barra:

[module/bi]
type = custom/text
label = "%{T4}%{T-}"
label-foreground = ${colors.window-background}
label-background = ${colors.background}


[module/bd]
type = custom/text
label = "%{T4}%{T-}"
label-foreground = ${colors.window-background}
label-background = ${colors.background}


[module/bi2]
type = custom/text
label = "%{T4}%{T-}"
label-foreground = ${colors.aurora-blue}
label-background = ${colors.background}


[module/bd2]
type = custom/text
label = "%{T4}%{T-}"
label-foreground = ${colors.aurora-blue}
label-background = ${colors.background}
