include-file = ~/.config/polybar/colors.ini

[bar/parent]
# monitor = ${env:MONITOR:}
# monitor = HDMI-A-0
width = 90% #98
; offset-x = 1.5% redonda
; offset-x = 1%  diagonal
; offset-y = 1%  redonda y diagonal
; offset-x = 5%
; offset-y = 2%
; height = 34 #22pt
; radius = 15
; radius = 0
fixed-center = true
fullscreen = true
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 3pt
#border-size = 2.5pt
#border-color = ${colors.border-color}
#border-color = ${colors.background}
padding-left = 0
padding-right = 0
module-margin-left = 0
module-margin-right = 0
separator = 
dim-value = 1.0
separator-foreground = ${colors.disabled}
font-0 = "JetBrains Mono:size=10;3"
font-1 = "monospace:size=10;2"
font-2 = "CaskaydiaCove Nerd Font:size=18;4"
font-3 = "CaskaydiaCove Nerd Font Mono:size=18;4"
font-4 = "M+ 1mn:style=bold:size=14;2"
font-5 = "BebasNeue:size=13;3"
font-6 = "Noto Sans CJK JP:size=8;2"
modules-left =  mymenu bd2 sep bi ewmh bd sep bi xwindow bd sep bi network-menu bd sep tray 
modules-center = bi date bd sep bi pacupdate bd
# modules-right = bi battery bd sep bi pulseaudio bd sep bi memory bd sep bi cpu bd sep bi cpu-temp bd sep bi gpu-temp bd sep bi magic-click bd sep sessionLogout
modules-right = bi battery bd sep bi pulseaudio bd sep bi memory bd sep bi cpu bd sep bi cpu-temp bd sep bi filesystem bd sep bi magic-click bd sep bi2 sessionLogout
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
override-redirect = true
wm-restack = i3
#wm-name = xfce4-panel
#bottom = false

[module/tray]
type = internal/tray
format = <tray>
format-margin = 5pt
tray-spacing = 8px
tray-padding = 0px
tray-size = 45%



[module/sep]
type = custom/text
label = " "
label-foreground = ${colors.window-background}


# [module/ewmh]
# type = internal/xworkspaces
# icon-default = 󰑊
# format = <label-state>
# format-background = ${colors.window-background}
# format-font = 3
# label-active ="%{T4}󰮯 %{T-}"
# label-active-font = 4
# #label-active-background = ${colors.background-alt}
# label-active-foreground = ${colors.primary} 
# label-active-padding = 2
# label-occupied = "%{T4}󰊠 %{T-}"
# label-occupied-font = 3
# label-occupied-foreground = ${colors.aurora-green}
# label-occupied-padding = 1
# label-empty = "%{T4}󰑊 %{T-}"
# label-empty-font = 3
# label-empty-foreground = ${colors.disabled}
# label-empty-padding = 1
# label-urgent = "%{T4}󰊠 %{T-}" 
# label-urgent-font = 3
# label-urgent-background = ${colors.primary}
# label-urgent-padding = 1
# enable-click = true
# enable-scroll = true
# pin-workspaces = false

[module/ewmh]
type = internal/xworkspaces

icon-0 = 1;一
icon-1 = 2;二
icon-2 = 3;三
icon-3 = 4;四
icon-4 = 5;五
icon-5 = 6;六
icon-6 = 7;七
icon-7 = 8;八
icon-8 = 9;九
icon-9 = 10;十

format = <label-state>
format-background = ${colors.window-background}

# Cambiamos font = 5 para que use la fuente japonesa que acabas de agregar
label-active = "%icon%"
label-active-font = 5
label-active-foreground = ${colors.primary}
label-active-padding = 1
label-active-underline = ${colors.primary}


label-occupied = "%icon%"
label-occupied-font = 7
label-occupied-foreground = ${colors.aurora-green}
label-occupied-padding = 2

label-empty = "%icon%"
label-empty-font = 7
label-empty-foreground = ${colors.disabled}
label-empty-padding = 2

label-urgent = "%icon%"
label-urgent-font = 7
label-urgent-foreground = ${colors.alert}
label-urgent-padding = 2

[module/xwindow]
type = internal/xwindow
# label = %class:0:60:...%
label = %title:0:20:...%
label-maxlen = 20
padding = 5
format-background = ${colors.window-background}
label-font = 6

[module/filesystem]
type = internal/fs
interval = 25
mount-0 = /

; Usamos un icono de disco (requiere Nerd Fonts)
format-mounted = <label-mounted>
format-mounted-prefix =  "%{T4}%{T-}" 
format-mounted-prefix-foreground = ${colors.aurora-yellow}
format-mounted-prefix-background =  ${colors.window-background}

label-mounted = "  %percentage_used%%"
label-mounted-background =${colors.window-background}
label-mounted-font = 6

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix-foreground = ${colors.primary}
format-volume = <ramp-volume> <label-volume> 
format-volume-background = ${colors.window-background}
label-volume = %{A3:~/.config/polybar/volume.sh:}%percentage%%%{A}
label-volume-font = 6
use-ui-max = false
label-muted = %{A3:~/.config/polybar/volume.sh:} Mute%{A}
label-muted-foreground = ${colors.disabled}
format-muted = <label-muted>
format-muted-prefix = 󰝟
format-muted-prefix-font = 4
format-muted-padding = 1
format-muted-background = ${colors.window-background}
ramp-volume-0 = 󰝟
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-3 = 
ramp-volume-4 =  
ramp-volume-5 = 
ramp-volume-6 = 
ramp-volume-7 =  
ramp-volume-8 =  
ramp-volume-9 =  
ramp-volume-foreground = ${colors.aurora-green}
ramp-volume-font = 4

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
label-layout = %layout%
label-layout-foreground = ${colors.primary}
label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
# format-prefix = "%{A1:kitty btop:}%{T4}%{T-} RAM:%{A}"
format-prefix = "%{A1:kitty btop:}%{T4}%{T-}%{A}"
label = " %{A1:kitty btop:} %percentage_used%%%{A}"
# label = "%{A1:kitty btop:} %used%%{A}"
format-padding = 0.5
format-prefix-foreground = ${colors.aurora-orange}
format-background = ${colors.window-background}
label-font = 6

[module/cpu]
type = internal/cpu
interval = 2
# format-prefix = "%{A1:kitty btop:}%{T4}%{T-} CPU:%{A}"
format-prefix = "%{A1:kitty btop:}%{T4}%{T-} %{A}"
format-padding = 0.5
format-prefix-foreground = ${colors.primary}
label = "%{A1:kitty btop:}%percentage%%%{A}"
format-background = ${colors.window-background}
label-font = 6

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#F0C674}%ifname%%{F-} %essid% %local_ip%

[module/network-menu]
type = custom/script
exec = ~/.config/polybar/network_speed.sh
interval = 5.0
format = <label>
format-connected-title = %{A1:networkmanager_dmenu:}%ssid%%{A}
format-background = ${colors.window-background}
format-foreground = ${colors.aurora-green}
format-padding = 0
format-margin = 0
label = %output%
label-font = 6
click-left = networkmanager_dmenu
click-middle = nmcli radio wifi on && notify-send "Wi-Fi Activado" "Conectando a: $(nmcli -t -f NAME connection show --active | head -n 1)"
click-right = nmcli radio wifi off

[module/eth]
inherit = network-base
interface-type = wired
label-connected = "%{F#53E8D4} %{F-}%downspeed:2% %{F#FF9535} %{F-}%upspeed:2%"
speed-unit = b/s
ping-intervel = 1
format-connected = <label-connected>
format-connected-prefix-font = 1
format-connected-padding = 1
format-disconnected = <label-disconnected>
format-disconnected-prefix = "󰈂 "
format-disconnected-prefix-font = 2
format-disconnected-padding = 1

[module/date]
type = internal/date
interval = 1
date = %I:%M %p
date-alt = "%{F#FF9535}%Y-%m-%d %I:%M:%S %p%{F-}"
label = %{A1:~/.config/polybar/calendar.sh:}%date%%{A}
label-font = 6
label-foreground = ${colors.aurora-green}
format = <label>
format-prefix = "%{T4}󱑂 %{T-}"
format-prefix-foreground = ${colors.primary}
format-prefix-font = 2
cursor-click = pointer
format-background = ${colors.window-background}

[module/battery]
type = internal/battery
battery = BAT1
adapter = AC
full-at = 98
low-at = 20
scroll-up = brightnessctl set +5%
scroll-down = brightnessctl set 5%-
format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <ramp-capacity> <label-full>
format-low = <animation-low> <label-low>

label-charging = %{A1:~/.config/polybar/battery.sh:}%percentage%%%{A}
label-discharging = %{A1:~/.config/polybar/battery.sh:}%percentage%%%{A}
label-full = %{A1:~/.config/polybar/battery.sh:}%percentage%%%{A}
label-low = %{A1:~/.config/polybar/battery.sh:}%percentage%%%{A}

format-charging-background = ${colors.window-background}
format-discharging-background = ${colors.window-background}
format-full-background = ${colors.window-background}
format-low-background = ${colors.window-background}

label-charging-font= 6
label-discharging-font= 6
label-full-font= 6
label-low-font= 6

ramp-capacity-0 = "%{T4}󰂎%{T-}" 
ramp-capacity-1 = "%{T4}󰁻%{T-}"
ramp-capacity-2 = "%{T4}󰁾%{T-}"
ramp-capacity-3 = "%{T4}󰂀%{T-}"
ramp-capacity-4 = "%{T4}󰁹%{T-}"
ramp-capacity-foreground = ${colors.primary}
animation-charging-0 = "%{T4}󰂆%{T-}"
animation-charging-1 = "%{T4}󰂈%{T-}"
animation-charging-2 = "%{T4}󰂉%{T-}"
animation-charging-3 = "%{T4}󰂋%{T-}"
animation-charging-4 = "%{T4}󰂅%{T-}"
animation-charging-framerate = 750
animation-charging-foreground = ${colors.aurora-green}
animation-low-0 = "%{T4}󱃍%{T-}"
animation-low-1 = " "
animation-low-framerate = 500
animation-low-foreground = ${colors.alert}


[settings]
#screenchange-reload = true
#pseudo-transparency = true

screenchange-reload = false

compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over

pseudo-transparency = false

[module/cpu-temp]
type = internal/temperature
interval = 1
hwmon-path = ${env:HWMON_CPU:}
warn-temperature = 75
units = true
format = <ramp> <label>
format-background = ${colors.window-background}
format-padding = 0
format-warn = <ramp> <label-warn>
label = %temperature-c%
label-foreground = ${colors.aurora-green}
label-font = 6
ramp-font = 4
# ramp-0 = " CPU:"
# ramp-1 = " CPU:"
# ramp-2 = " CPU:"
# ramp-3 = " CPU:"

ramp-0 = ""
ramp-1 = ""
ramp-2 = ""
ramp-3 = ""




[module/gpu-temp]
type = internal/temperature
interval = 1
hwmon-path = ${env:HWMON_GPU:}
warn-temperature = 80
units = true
format = <ramp> <label>
format-background = ${colors.window-background}
format-warn = <ramp> <label-warn>
label = %temperature-c%
label-foreground = ${colors.aurora-blue}
ramp-font = 4
ramp-0 = " GPU:"
ramp-1 = " GPU:"
ramp-2 = " GPU:"
ramp-3 = " GPU:"

#         󰌽   󰈸
[module/mymenu]
type = custom/text
format = <label>
format-padding = 0.7
# label = "%{F#1A1B26} Menu%{F-}" 
label = "%{F#1A1B26} %{F-}" 
click-left = /home/$USER/.config/polybar/rofi.sh
format-background = ${colors.aurora-blue}
format-font = 3

[module/sessionLogout]
type = custom/text
format = <label>
format-padding = 0.7
label = "%{F#1A1B26} %{F-}"
click-left = /home/$USER/.config/polybar/powermenu.sh
format-background = ${colors.aurora-blue}
format-font = 4

[module/pacupdate]
type = custom/script
exec = /home/$USER/.config/polybar/mintupdates.sh
interval = 1000
label = %output%


click-left = /home/$USER/.config/polybar/mintupdates.sh --notify && polybar-msg action "#pacupdate.module_refresh"
# click-left = notify-send "Actualizaciones" "Buscando..." && /home/$USER/.config/polybar/mintupdates.sh --notify && polybar-msg action "#pacupdate.module_refresh"
# click-left = notify-send "Updates:" "$(mintupdate-cli list)"
format-background = ${colors.window-background}

[module/magic-click]
type = custom/text
format = <label>
format-background = ${colors.window-background}
# label = " Magic"
label = "  "
label-font = 4

click-left = /home/$USER/.config/polybar/rofi-tools.sh
; click-left = /home/$USER/.config/polybar/rofi-wallpaper-i3.sh
; click-middle = eww open csheet
; click-right = /home/$USER/.config/polybar/rofi-themes-i3.sh

[module/i3]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = false
index-sort = true
enable-scroll = false
wrapping-scroll = false
reverse-scroll = false
fuzzy-match = true

show-urgent = true

